<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1240" height="720" fill="#ffffff"/>
  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="700">사진이 숫자(벡터)가 되기까지 — 픽셀 하나부터 768개 숫자까지</text>
  <text x="620" y="58" text-anchor="middle" font-size="13" fill="#6b7280">시각 인덱싱 한 장면(프레임)이 DB 에 저장되는 숫자로 바뀌는 과정</text>

  <!-- ===== 단계 1: 원본 사진 ===== -->
  <g transform="translate(40,90)">
    <rect width="260" height="300" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="130" y="26" text-anchor="middle" font-size="15" font-weight="700">① 원본 사진 (프레임)</text>
    <text x="130" y="44" text-anchor="middle" fill="#6b7280">ffmpeg 가 영상에서 5초마다 뽑음</text>

    <!-- 작은 그림: 하늘 / 풀밭 / 강아지(갈색) -->
    <g transform="translate(40,60)">
      <rect width="180" height="120" fill="#bfe3ff"/>
      <rect y="78" width="180" height="42" fill="#8fd18f"/>
      <circle cx="150" cy="22" r="14" fill="#ffd966"/>
      <ellipse cx="90" cy="88" rx="34" ry="18" fill="#a66a2e"/>
      <circle cx="120" cy="72" r="13" fill="#a66a2e"/>
      <circle cx="124" cy="70" r="2" fill="#1f2937"/>
      <rect width="180" height="120" fill="none" stroke="#9ca3af"/>
      <!-- 확대 표시 픽셀 -->
      <rect x="120" y="20" width="12" height="12" fill="none" stroke="#dc2626" stroke-width="2"/>
    </g>
    <text x="130" y="205" text-anchor="middle">사진은 아주 작은 점(픽셀)의 모임</text>
    <text x="130" y="222" text-anchor="middle">1920×1080 = 약 207만 개 점</text>
    <text x="130" y="250" text-anchor="middle" fill="#dc2626" font-weight="700">빨간 네모 = 점 하나 확대 →</text>
    <text x="130" y="280" text-anchor="middle" fill="#6b7280">컴퓨터는 "그림" 을 모름.</text>
    <text x="130" y="296" text-anchor="middle" fill="#6b7280">점마다 색 숫자만 있음.</text>
  </g>

  <!-- 화살표 1→2 -->
  <line x1="304" y1="240" x2="336" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 단계 2: 픽셀 하나 = 숫자 3개 ===== -->
  <g transform="translate(340,90)">
    <rect width="260" height="300" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="130" y="26" text-anchor="middle" font-size="15" font-weight="700">② 점 하나 = 숫자 3개</text>
    <text x="130" y="44" text-anchor="middle" fill="#6b7280">빨강 · 초록 · 파랑 의 밝기 (0~255)</text>

    <!-- 큰 하늘색 픽셀 -->
    <rect x="85" y="58" width="90" height="90" fill="#bfe3ff" stroke="#dc2626" stroke-width="3"/>
    <text x="130" y="110" text-anchor="middle" font-size="13" fill="#1f2937">하늘색 점</text>

    <!-- RGB 막대 -->
    <g transform="translate(30,165)">
      <rect width="20" height="20" fill="#ef4444"/><text x="28" y="15">R 빨강 = 191</text>
      <rect y="28" width="20" height="20" fill="#22c55e"/><text x="28" y="43">G 초록 = 227</text>
      <rect y="56" width="20" height="20" fill="#3b82f6"/><text x="28" y="71">B 파랑 = 255</text>
    </g>
    <text x="130" y="262" text-anchor="middle" font-family="Menlo, monospace" font-size="12">(191, 227, 255)</text>
    <text x="130" y="282" text-anchor="middle" fill="#6b7280">흰색 = (255,255,255)</text>
    <text x="130" y="296" text-anchor="middle" fill="#6b7280">검정 = (0,0,0)   빨강 = (255,0,0)</text>
  </g>

  <!-- 화살표 2→3 -->
  <line x1="604" y1="240" x2="636" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 단계 3: 0~255 → -1~+1 ===== -->
  <g transform="translate(640,90)">
    <rect width="260" height="300" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="130" y="26" text-anchor="middle" font-size="15" font-weight="700">③ 크기 맞추기 (전처리)</text>
    <text x="130" y="44" text-anchor="middle" fill="#6b7280">AI 모델이 좋아하는 범위로 바꿈</text>

    <!-- 눈금 변환 -->
    <g transform="translate(30,70)">
      <text x="0" y="0" font-weight="700">0 ~ 255</text>
      <text x="90" y="0">→ 255 로 나눔 →</text>
      <text x="0" y="24" font-weight="700">0 ~ 1</text>
      <text x="90" y="24">→ (x − 0.5) ÷ 0.5 →</text>
      <text x="0" y="48" font-weight="700" fill="#2563eb">−1 ~ +1</text>
    </g>

    <!-- 예시 -->
    <g transform="translate(30,140)" font-family="Menlo, monospace" font-size="11">
      <text y="0">하늘색 (191, 227, 255)</text>
      <text y="18" fill="#2563eb">→ (+0.50, +0.78, +1.00)</text>
      <text y="44">검정 (0, 0, 0) → (−1, −1, −1)</text>
      <text y="62">흰색 (255,255,255) → (+1, +1, +1)</text>
    </g>

    <text x="130" y="240" text-anchor="middle">사진 크기도 모델 규격(정사각)으로</text>
    <text x="130" y="256" text-anchor="middle">줄이고 가운데를 잘라 맞춤</text>
    <text x="130" y="282" text-anchor="middle" fill="#6b7280">아직은 "색 숫자". 의미 없음.</text>
  </g>

  <!-- 화살표 3→4 -->
  <line x1="904" y1="240" x2="936" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 단계 4: 패치 ===== -->
  <g transform="translate(940,90)">
    <rect width="260" height="300" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="130" y="26" text-anchor="middle" font-size="15" font-weight="700">④ 16×16 조각으로 자르기</text>
    <text x="130" y="44" text-anchor="middle" fill="#6b7280">모델은 점 하나씩 안 봄. 조각 단위로 봄</text>

    <!-- 격자 그림 -->
    <g transform="translate(40,60)">
      <rect width="180" height="120" fill="#bfe3ff"/>
      <rect y="78" width="180" height="42" fill="#8fd18f"/>
      <ellipse cx="90" cy="88" rx="34" ry="18" fill="#a66a2e"/>
      <circle cx="120" cy="72" r="13" fill="#a66a2e"/>
      <g stroke="#ffffff" stroke-opacity="0.8" stroke-width="1">
        <line x1="30" y1="0" x2="30" y2="120"/><line x1="60" y1="0" x2="60" y2="120"/><line x1="90" y1="0" x2="90" y2="120"/>
        <line x1="120" y1="0" x2="120" y2="120"/><line x1="150" y1="0" x2="150" y2="120"/>
        <line x1="0" y1="30" x2="180" y2="30"/><line x1="0" y1="60" x2="180" y2="60"/><line x1="0" y1="90" x2="180" y2="90"/>
      </g>
      <rect x="90" y="60" width="30" height="30" fill="none" stroke="#dc2626" stroke-width="2"/>
      <rect width="180" height="120" fill="none" stroke="#9ca3af"/>
    </g>
    <text x="130" y="205" text-anchor="middle">조각 1개 = 16×16 점 × 3색</text>
    <text x="130" y="222" text-anchor="middle" font-weight="700">= 숫자 768개를 한 줄로</text>
    <text x="130" y="250" text-anchor="middle" fill="#6b7280">256px 사진이면 조각 256개</text>
    <text x="130" y="266" text-anchor="middle" fill="#6b7280">조각마다 "어떤 조각과 관련 있나"</text>
    <text x="130" y="282" text-anchor="middle" fill="#6b7280">를 수십 층에 걸쳐 계산 (Transformer)</text>
  </g>

  <!-- 아래로 가는 화살표 -->
  <line x1="1070" y1="394" x2="1070" y2="420" stroke="#374151" stroke-width="2"/>
  <line x1="1070" y1="420" x2="170" y2="420" stroke="#374151" stroke-width="2"/>
  <line x1="170" y1="420" x2="170" y2="444" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== 단계 5: 임베딩 ===== -->
  <g transform="translate(40,450)">
    <rect width="560" height="230" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="700">⑤ 모델 출력 = 숫자 768개 (벡터)</text>
    <text x="280" y="46" text-anchor="middle" fill="#6b7280">SigLIP2 모델이 조각 전부를 합쳐 한 줄로 요약</text>

    <!-- 벡터 막대 -->
    <g transform="translate(30,65)">
      <rect width="500" height="26" fill="#ffffff" stroke="#a5b4fc"/>
      <text x="8" y="18" font-family="Menlo, monospace" font-size="12">[ 0.12, −0.33, 0.80, 0.05, −0.41, … , 0.27 ]</text>
      <text x="500" y="44" text-anchor="end" fill="#6b7280">← 768 칸</text>
    </g>

    <text x="30" y="130">· 각 칸은 "빨강" "하늘" 같은 뜻 없음. 768칸 조합 전체가 "강아지가 풀밭에 있는 사진" 이라는 뜻.</text>
    <text x="30" y="150">· 수억 장의 (사진, 설명글) 쌍으로 학습됨 → 같은 뜻이면 비슷한 숫자가 나오도록 조정돼 있음.</text>
    <text x="30" y="170">· 길이를 1 로 맞춤(정규화) → 두 벡터 비교할 때 "방향" 만 보면 됨 (코사인 유사도).</text>
    <text x="30" y="190">· 5초 구간 프레임 2장 벡터의 평균 → DB 테이블 <tspan font-family="Menlo, monospace">clip_embeddings</tspan> 에 저장.</text>
    <text x="30" y="212" fill="#6b7280">원본 사진은 저장 안 함. 숫자 768개(약 3KB)에서 사진 복원 불가.</text>
  </g>

  <!-- ===== 글자도 같은 공간 ===== -->
  <g transform="translate(640,450)">
    <rect width="560" height="230" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="700">글자도 같은 방식으로 숫자 768개가 됨</text>
    <text x="280" y="46" text-anchor="middle" fill="#6b7280">그래서 "글자로 사진 검색" 이 가능</text>

    <g transform="translate(30,65)" font-family="Menlo, monospace" font-size="12">
      <rect width="500" height="26" fill="#ffffff" stroke="#86efac"/>
      <text x="8" y="18">"강아지"  → [ 0.11, −0.30, 0.79, 0.06, −0.40, … ]</text>
      <rect y="36" width="500" height="26" fill="#ffffff" stroke="#86efac"/>
      <text x="8" y="54">사진(위)   → [ 0.12, −0.33, 0.80, 0.05, −0.41, … ]</text>
      <rect y="72" width="500" height="26" fill="#ffffff" stroke="#fca5a5"/>
      <text x="8" y="90">"엑셀 함수" → [ −0.70, 0.05, −0.22, 0.61, 0.13, … ]</text>
    </g>

    <text x="30" y="180" font-weight="700" fill="#16a34a">"강아지" 와 강아지 사진 → 숫자가 거의 같음 → 검색 결과로 나옴</text>
    <text x="30" y="200" font-weight="700" fill="#dc2626">"엑셀 함수" → 숫자가 전혀 다름 → 안 나옴</text>
    <text x="30" y="220" fill="#6b7280">검색 = 질문을 숫자로 바꾼 뒤, DB 에서 가장 가까운 숫자 줄 찾기</text>
  </g>
</svg>
