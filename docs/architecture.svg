<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1240" height="780" fill="#ffffff"/>
  <text x="620" y="36" text-anchor="middle" font-size="22" font-weight="700">claude-vector 구성도 — 영상을 말로 검색하는 실험 (전체 흐름)</text>

  <!-- 사용자 화면 -->
  <rect x="30" y="70" width="240" height="250" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="150" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">사용자 화면 (내 컴퓨터)</text>
  <rect x="50" y="108" width="200" height="66" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="150" y="132" text-anchor="middle" font-weight="700">브라우저</text>
  <text x="150" y="152" text-anchor="middle" fill="#4b5563">http://localhost:8000</text>
  <rect x="50" y="190" width="200" height="110" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="150" y="212" text-anchor="middle" font-weight="700">데스크톱 앱 (Mac 창)</text>
  <text x="150" y="232" text-anchor="middle" fill="#4b5563">웹 화면을 창으로 감싼 것</text>
  <text x="150" y="250" text-anchor="middle" fill="#4b5563">pywebview · desktop/app.py</text>
  <text x="150" y="272" text-anchor="middle" fill="#4b5563">'영상 추가' → 파일 고르기</text>
  <text x="150" y="289" text-anchor="middle" fill="#4b5563">→ ./media 폴더로 복사</text>

  <!-- api 컨테이너 -->
  <rect x="310" y="70" width="570" height="560" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="595" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">api 컨테이너 · 검색 서버 (AI 모델 실행, CPU) · FastAPI · :8000</text>

  <rect x="330" y="108" width="530" height="52" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="595" y="130" text-anchor="middle" font-weight="700">웹 화면 · 영상 목록 / 영상 올리기 / 인덱싱 시작 / 진행 보드 (왼쪽아래)</text>
  <text x="595" y="149" text-anchor="middle" fill="#4b5563" font-size="11">GET /api/videos · POST /api/videos/upload · POST /api/videos/{id}/ingest · GET /api/progress</text>

  <rect x="330" y="186" width="530" height="226" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="345" y="206" font-weight="700">인덱싱 작업자 (한 번에 하나씩) — 영상을 조각내 숫자(벡터)로 바꿔 DB 에 저장</text>

  <text x="345" y="232" font-size="11" fill="#6b7280" font-weight="700">화면 (눈에 보이는 것)</text>
  <rect x="345" y="240" width="165" height="62" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="427" y="260" text-anchor="middle">① 5초마다 사진 2장 뽑기</text>
  <text x="427" y="277" text-anchor="middle" fill="#4b5563">ffmpeg · CLIP_SEC=5</text>
  <text x="427" y="293" text-anchor="middle" fill="#4b5563">2장 평균 · 썸네일 저장</text>
  <line x1="510" y1="271" x2="530" y2="271" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="532" y="240" width="160" height="62" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="612" y="260" text-anchor="middle">② 사진 → 숫자 목록</text>
  <text x="612" y="277" text-anchor="middle" fill="#4b5563">SigLIP2 ViT-B-16</text>
  <text x="612" y="293" text-anchor="middle" fill="#4b5563">open_clip · webli</text>
  <line x1="692" y1="271" x2="712" y2="271" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="714" y="240" width="130" height="62" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="779" y="265" text-anchor="middle" font-weight="700">숫자 768개</text>
  <text x="779" y="284" text-anchor="middle" fill="#4b5563">+ 구간 · 썸네일</text>

  <text x="345" y="328" font-size="11" fill="#6b7280" font-weight="700">자막 (말한 내용)</text>
  <rect x="345" y="336" width="165" height="62" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="427" y="356" text-anchor="middle">① 자막 파일 있으면 읽기</text>
  <text x="427" y="373" text-anchor="middle" fill="#4b5563">없으면 받아쓰기</text>
  <text x="427" y="389" text-anchor="middle" fill="#4b5563">faster-whisper small · 한국어</text>
  <line x1="510" y1="367" x2="530" y2="367" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="532" y="336" width="160" height="62" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="612" y="356" text-anchor="middle">② 45초씩 묶어 숫자로</text>
  <text x="612" y="373" text-anchor="middle" fill="#4b5563">Qwen3-Embedding-0.6B</text>
  <text x="612" y="389" text-anchor="middle" fill="#4b5563">CHUNK_SEC=45</text>
  <line x1="692" y1="367" x2="712" y2="367" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="714" y="336" width="130" height="62" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="779" y="361" text-anchor="middle" font-weight="700">숫자 1024개</text>
  <text x="779" y="380" text-anchor="middle" fill="#4b5563">+ 구간 · 글자</text>

  <rect x="330" y="436" width="530" height="176" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="345" y="456" font-weight="700">검색 — 질문도 같은 모델로 숫자로 바꿈 → DB 에서 가장 가까운 k개 → 점수 낮으면 버림</text>
  <text x="345" y="482"><tspan font-weight="700">화면 검색</tspan>  글자 또는 사진 → SigLIP2 → clip_embeddings 에서 찾기   (POST /api/search/visual)</text>
  <text x="365" y="499" fill="#4b5563">점수 = "질문과 맞을 확률" sigmoid(scale·cos + bias) · 0.10 미만 버림</text>
  <text x="345" y="523"><tspan font-weight="700">자막 검색</tspan>  글자 → Qwen3 → subtitle_chunks 에서 찾기 · cosine 0.35 미만 버림   (/subtitle)</text>
  <text x="345" y="547"><tspan font-weight="700">통합 검색</tspan>  둘 다 검색 → 순위 합산(RRF, k=60) → 영상·구간 단위로 정렬   (/hybrid)</text>
  <text x="345" y="571" fill="#4b5563">응답 = 결과 목록 + 과정 기록(trace: 숫자 변환 · SQL · rows · 합산) → 화면 오른쪽 패널</text>
  <text x="345" y="595" fill="#4b5563">결과 클릭 → 그 구간(start_sec)부터 재생 · 썸네일은 /data 에서 보여줌</text>

  <!-- db 컨테이너 -->
  <rect x="920" y="70" width="290" height="560" rx="10" fill="#eefbf0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1065" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">db 컨테이너 · 숫자 저장소 · :5433</text>
  <rect x="940" y="108" width="250" height="70" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="1065" y="130" text-anchor="middle" font-weight="700">videos — 영상별 인덱싱 상태</text>
  <text x="1065" y="148" text-anchor="middle" fill="#4b5563">id(파일명), 길이(duration)</text>
  <text x="1065" y="165" text-anchor="middle" fill="#4b5563">화면/자막 상태 · 조각 개수</text>

  <rect x="940" y="216" width="250" height="110" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="1065" y="238" text-anchor="middle" font-weight="700">clip_embeddings — 화면 조각 (5초)</text>
  <text x="1065" y="257" text-anchor="middle" fill="#4b5563">video_id, start_sec, end_sec, thumb_path</text>
  <text x="1065" y="276" text-anchor="middle" font-weight="700" fill="#1d4ed8">embedding vector(768)</text>
  <text x="1065" y="295" text-anchor="middle" fill="#4b5563">빠른 검색 인덱스 HNSW (cosine)</text>
  <text x="1065" y="312" text-anchor="middle" fill="#4b5563">btree (video_id, start_sec)</text>

  <rect x="940" y="346" width="250" height="110" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="1065" y="368" text-anchor="middle" font-weight="700">subtitle_chunks — 자막 묶음 (45초)</text>
  <text x="1065" y="387" text-anchor="middle" fill="#4b5563">video_id, start_sec, end_sec, text</text>
  <text x="1065" y="406" text-anchor="middle" font-weight="700" fill="#1d4ed8">embedding vector(1024)</text>
  <text x="1065" y="425" text-anchor="middle" fill="#4b5563">빠른 검색 인덱스 HNSW (cosine)</text>
  <text x="1065" y="442" text-anchor="middle" fill="#4b5563">btree (video_id, start_sec)</text>

  <text x="1065" y="474" text-anchor="middle" fill="#4b5563">PostgreSQL 17 + pgvector 확장 (벡터 저장·검색 기능)</text>
  <text x="1065" y="492" text-anchor="middle" fill="#4b5563">테이블 정의: db/init.sql (처음 1회)</text>
  <text x="1065" y="510" text-anchor="middle" fill="#4b5563">데이터 파일: pgdata 볼륨</text>
  <text x="1065" y="540" text-anchor="middle" fill="#4b5563" font-size="11">화면/자막은 숫자 공간이 달라 테이블·모델 따로</text>
  <text x="1065" y="557" text-anchor="middle" fill="#4b5563" font-size="11">통합 검색은 SQL 이 아니라 앱에서 순위 합산(RRF)</text>

  <!-- 화살표: 사용자 → api -->
  <line x1="250" y1="141" x2="328" y2="134" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="289" y="124" text-anchor="middle" font-size="11" fill="#374151">HTTP</text>
  <line x1="250" y1="230" x2="328" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="#374151">HTTP</text>

  <!-- 화살표: 화면 → 작업자 -->
  <line x1="595" y1="160" x2="595" y2="184" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="177" text-anchor="middle" font-size="11" fill="#374151">작업 등록 (대기열)</text>

  <!-- 화살표: 숫자 → db 저장 -->
  <line x1="844" y1="271" x2="938" y2="271" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="891" y="263" text-anchor="middle" font-size="11" fill="#374151">저장 (INSERT)</text>
  <line x1="844" y1="367" x2="938" y2="401" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="891" y="376" text-anchor="middle" font-size="11" fill="#374151">저장 (INSERT)</text>

  <!-- 화살표: 검색 ↔ db -->
  <line x1="860" y1="524" x2="938" y2="524" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="899" y="512" text-anchor="middle" font-size="11" fill="#374151">가까운 순 k개</text>
  <text x="899" y="541" text-anchor="middle" font-size="10" fill="#374151">emb &lt;=&gt; $q LIMIT k</text>

  <!-- 화살표: 데스크톱 → media -->
  <line x1="150" y1="300" x2="150" y2="672" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="160" y="500" font-size="11" fill="#6b7280">영상 파일 복사</text>
  <!-- 화살표: media → 작업자 -->
  <line x1="320" y1="672" x2="320" y2="414" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="327" y="658" font-size="11" fill="#6b7280">영상 읽기</text>

  <!-- 저장 위치 -->
  <rect x="30" y="674" width="1180" height="86" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="50" y="696" font-size="14" font-weight="700" fill="#374151">파일이 실제로 놓이는 곳 (docker-compose.yml 볼륨, project name: claude-vector)</text>
  <text x="50" y="720"><tspan font-weight="700">./media</tspan> → /media (영상·자막 파일)   ·   <tspan font-weight="700">./api/app</tspan> → /srv/app (서버 코드, 고치면 바로 반영)   ·   <tspan font-weight="700">appdata</tspan> → /data (썸네일)</text>
  <text x="50" y="744"><tspan font-weight="700">hfcache</tspan> → /root/.cache (AI 모델 파일 ~2GB, 처음 한 번 내려받음: SigLIP2·Qwen3·Whisper)   ·   <tspan font-weight="700">pgdata</tspan> → DB 데이터</text>
</svg>
